name: Validate neuron atlas
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical content and graph interactions
        run: make check
